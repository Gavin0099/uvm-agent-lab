# Secondary experimental vLLM configuration for Dual GV100 (64GB, NVLink).
# Primary pre-GV100 baseline is deploy/llama_cpp_gv100.yaml.
profile_role: "secondary_experimental"
model: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
quantization: "awq"
tensor_parallel_size: 2
max_model_len: 32768
gpu_memory_utilization: 0.90
swap_space: 4  # GB CPU swap
enforce_eager: false
disable_custom_all_reduce: false
trust_remote_code: true
host: "0.0.0.0"
port: 8000
