[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uvm-agent-lab"
version = "0.1.0"
description = "Deterministic Evaluation and AI Governance Testbed for UVM Verification Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: isolated unit tests",
    "contract: interface and schema contract tests",
    "integration: cross-component integration tests",
    "hardware: requires GV100 hardware environment",
    "live_model: requires live inference endpoint",
    "private_fixture: requires private benchmark dataset"
]

