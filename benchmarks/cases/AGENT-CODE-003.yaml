  - build_log
  - test_log
  - validator_report

verification:
  build:
    argv: ["python", "-m", "py_compile", "{target_file}"]
  test:
    argv: ["python", "-m", "pytest", "-q", "fixtures/coding_agent/AGENT_CODE_003"]
  timeout_sec: 120

max_steps: 10
timeout_seconds: 120
