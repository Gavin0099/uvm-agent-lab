id: AGENT-CODE-003
title: "Add version parser boundary coverage"
description: "Extend the Python unit-test coverage for version parsing without changing production code outside the bounded fixture."
validator_profile: lightweight

task:
  type: test_change
  goal: "Add deterministic tests for malformed, incomplete, and valid semantic version inputs."

inputs:
  requirement_id: "AGENT-CODE-003"
  target_file: "fixtures/coding_agent/AGENT_CODE_003/test_version_parser.py"

allowed_paths:
  - "fixtures/coding_agent/AGENT_CODE_003/"
forbidden_paths:
  - "rtl/"
  - "additional/"
  - ".git/"

acceptance:
  build: pass
  test: pass
  lint: optional
  validator: pass

required_evidence:
