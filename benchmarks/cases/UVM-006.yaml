  - "uvm/env/"

acceptance:
  compile: pass
  simulation: pass
  coverage_target: 100.0

required_evidence:
  - requirement_id
  - git_diff
  - compile_log
  - simulation_log

max_steps: 10
timeout_seconds: 60
