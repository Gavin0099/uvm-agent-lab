id: UVM-006
title: "Generate UVM RAL Model & Lock Protection Test"
description: "Author UVM Register Abstraction Layer (RAL) block with field access policies (RO, RW, W1C) and verify lock protection behavior."

task:
  type: create_testcase
  goal: "Create uvm_reg_block model in uvm/ral/usb3_reg_model.sv and verify sticky register write-lock protection."

inputs:
  requirement_id: "USB3-WR-001"
  target_file: "uvm/ral/usb3_reg_model.sv"

allowed_paths:
