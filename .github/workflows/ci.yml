name: UVM Agent Lab CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Deterministic Benchmarks & AI Governance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

      - name: Execute Deterministic Benchmark Runs
        run: |
          python scripts/run_case.py --all --runner mock --output-dir results/
          python scripts/summarize_results.py --results-dir results/ --output-md results/summary.md

      - name: Run Gate 1 Retrieval Evaluator
        run: |
          python retrieval/evaluator.py
