name: UVM Agent Lab CI & Governance Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-governance:
    name: Comprehensive Verification & AI Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run Dependency Manifest Diff Validator
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -n "${PR_BASE_SHA:-}" ]; then
            BASE_REF="$PR_BASE_SHA"
          elif [ -n "${PUSH_BEFORE_SHA:-}" ] && [ "$PUSH_BEFORE_SHA" != "$ZERO_SHA" ] && git rev-parse --verify -q "$PUSH_BEFORE_SHA" >/dev/null; then
            # Covers the whole pushed commit range, not just the tip commit,
            # so a manifest change in an earlier pushed commit followed by an
            # unrelated tip commit is still inspected.
            BASE_REF="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify -q HEAD^ >/dev/null; then
            BASE_REF="HEAD^"
          else
            echo "[SKIP] No base commit available to diff against; skipping dependency manifest diff validation."
            BASE_REF=""
          fi
          if [ -n "$BASE_REF" ] && ! git diff --quiet "$BASE_REF" -- pyproject.toml requirements.txt; then
            # Only reached when this PR actually changes pyproject.toml
            # and/or requirements.txt: a PR that touches neither has
            # nothing for this gate to validate, regardless of whether the
            # base branch has a trust root yet, so it is skipped rather
            # than forced through an artificial bootstrap fallback.
            #
            # Read the allowlist from BASE_REF, not the checked-out PR tip:
            # otherwise a PR that edits both a manifest AND
            # governance/approved_dependency_additions.json could add its
            # own package to the allowlist and approve itself before that
            # policy change has been separately reviewed. There is no
            # bootstrap fallback: an absent allowlist at BASE_REF is not
            # evidence the proposed policy is trustworthy, it is only
            # evidence there is no prior policy to check the PR's own copy
            # against, so it fails closed unconditionally. The trust root
            # (this file, the validator, and this CI wiring) must be
            # established on the base branch by its own, separately
            # reviewed and merged bootstrap change that adds no manifest
            # dependencies of its own, before any PR that changes the
            # manifests can rely on it.
            TRUSTED_ALLOWLIST="$(mktemp)"
            if ! git show "$BASE_REF:governance/approved_dependency_additions.json" > "$TRUSTED_ALLOWLIST" 2>/dev/null; then
              echo "[FAIL] This PR changes pyproject.toml and/or requirements.txt, but governance/approved_dependency_additions.json could not be read from base ref $BASE_REF; refusing to fall back to the PR-controlled allowlist. Merge a dedicated bootstrap change first (policy + validator + CI wiring only, no manifest dependency additions), then retry."
              exit 1
            fi
            # --lenient: this generic CI gate cannot attribute a diff to a
            # single dependency-authorization task (e.g. GV100H-M2-DEPS), so
            # it must not freeze every other task's legitimate manifest
            # edits. It still rejects unapproved or direct-reference/VCS
            # dependency additions; only the real task-scoped enforcement in
            # GovernanceRuntimeBridge uses the strict additive-only mode.
            # Runs before "Install dependencies" so an unapproved dependency
            # is rejected before pip ever installs/builds it.
            python validators/dependency_manifest_diff_validator.py --base-ref "$BASE_REF" --allowlist "$TRUSTED_ALLOWLIST" --lenient
          elif [ -n "$BASE_REF" ]; then
            echo "[SKIP] Neither pyproject.toml nor requirements.txt changed relative to $BASE_REF; nothing for this gate to validate."
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pytest Suite (32 tests)
        run: |
          pytest -v tests/

      - name: Execute Multi-Turn Self-Healing Benchmark Suite
        run: |
          python scripts/run_case.py --all --runner multi_turn --output-dir results/
          python scripts/summarize_results.py --results-dir results/ --output-md results/summary.md

      - name: Run Gate 1 Retrieval Evaluator
        run: |
          python retrieval/evaluator.py

      - name: Run Domain Scope & Evidence Validators
        run: |
          python validators/verification_scope_validator.py
          python validators/zero_trust_evidence_validator.py

      - name: Run AI Governance Drift Checker
        run: |
          python additional/ai-governance-framework/governance_tools/governance_drift_checker.py \
            --repo . \
            --framework-root additional/ai-governance-framework \
            --format human

      - name: Run AI Governance Quickstart Smoke
        run: |
          python additional/ai-governance-framework/governance_tools/quickstart_smoke.py \
            --project-root . \
            --plan PLAN.md \
            --contract contract.yaml \
            --format human
