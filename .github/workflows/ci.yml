name: UVM Agent Lab CI & Governance Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-governance:
    name: Comprehensive Verification & AI Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pytest Suite (32 tests)
        run: |
          pytest -v tests/

      - name: Execute Multi-Turn Self-Healing Benchmark Suite
        run: |
          python scripts/run_case.py --all --runner multi_turn --output-dir results/
          python scripts/summarize_results.py --results-dir results/ --output-md results/summary.md

      - name: Run Gate 1 Retrieval Evaluator
        run: |
          python retrieval/evaluator.py

      - name: Run Domain Scope & Evidence Validators
        run: |
          python validators/verification_scope_validator.py
          python validators/zero_trust_evidence_validator.py

      - name: Run AI Governance Drift Checker
        run: |
          python additional/ai-governance-framework/governance_tools/governance_drift_checker.py \
            --repo . \
            --framework-root additional/ai-governance-framework \
            --format human

      - name: Run AI Governance Quickstart Smoke
        run: |
          python additional/ai-governance-framework/governance_tools/quickstart_smoke.py \
            --project-root . \
            --plan PLAN.md \
            --contract contract.yaml \
            --format human
