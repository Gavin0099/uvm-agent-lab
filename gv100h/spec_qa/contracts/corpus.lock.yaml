  independent_from_corpus: true
  evaluation_leakage_policy:
    golden_questions_must_not_be_generated_from_retrieved_evidence: true
    expected_outcomes_require_independent_review: true
    benchmark_answers_are_not_retrieval_evidence: true
  current_status: "deterministic_smoke_baseline_only"
  full_poc1_acceptance_set: false

binding_requirements:
  content_hash_algorithm: "sha256_tracked_relative_posix_path_content_bytes_v3"
  source_entry_must_have:
    - "immutable_commit_or_document_revision"
    - "content_sha256"
    - "authority_role"
  scope_binding:
    requires_one_of:
      - "included_chapters"
      - "included_scope"
      - "canonical_entrypoint"
  pending_markers_block:
    - "full_phase1_qualification"
    - "claim_of_complete_official_corpus"
    - "live_model_qualification"